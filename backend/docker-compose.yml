# Remove or comment out the version line if you're using Docker Compose v2 (the plugin)
# version: '3.8'

services:
  db:
    image: postgres:15
    container_name: postgres_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: my_db
      POSTGRES_USER: my_user
      POSTGRES_PASSWORD: my_password
    volumes:
      - db_data:/var/lib/postgresql/data

  web:
    build: .
    container_name: backend_api
    command: >
      sh -c "python manage.py makemigrations &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      DJANGO_DEBUG: 'true'
      POSTGRES_DB: my_db
      POSTGRES_USER: my_user
      POSTGRES_PASSWORD: my_password
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    volumes:
      - .:/app

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    depends_on:
      - db
    environment:
      PGADMIN_DEFAULT_EMAIL: "admin@example.com"  # Replace with your preferred admin email
      PGADMIN_DEFAULT_PASSWORD: "my_pgadmin_password"  # Replace with a secure password
      # Optional configurations can be added here (e.g., PGADMIN_CONFIG_*)
    ports:
      - "5050:80"  # Expose pgAdmin on localhost:5050
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  db_data:
  pgadmin_data:
